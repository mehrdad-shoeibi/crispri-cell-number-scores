name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned environment
        run: python -m pip install -r bioinf2027/requirements.txt
      - name: Use an empty data root
        run: |
          mkdir -p "$RUNNER_TEMP/data_root"
          echo "IGA_STORAGE_ROOT=$RUNNER_TEMP/data_root" >> "$GITHUB_ENV"
      - name: Run the tests
        run: python -m pytest
      - name: Rebuild the tables and figures from the saved statistics
        run: make tables figures
      - name: Tables and figure data must be unchanged
        run: make check

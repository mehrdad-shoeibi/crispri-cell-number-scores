# Every axis label, legend entry, tick label and panel heading of the figures, in one place (the author's answer to the
# stop of 2026-11-17 20:30, bioinf2027/GATE.md). The figure scripts read this file and nothing else for their words;
# change a value here and redraw the figure with its one command (bioinf2027/figures/README.md).
#
# How it works: [terms] holds one word or phrase per report symbol (the symbol is in the comment beside it). The
# entries of the figure sections refer to a term by its key in braces, for example "{C1}", so that a term changed here
# changes every figure that uses it. Other braces, such as {dataset} or {n_pert_1}, are filled by the script from the
# data. The values are placeholder wording: the author writes the final wording. A value may not contain a report
# symbol; figlib stops the drawing if one appears. Each drawing's record lists the entries it read.

[terms]
# The author's list (answer to the stop of 20:30).
